name: Deploy API

# The backend is deployed to Render.com only from main, and only when something it consists of changes.
on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.server.json"
      - ".node-version"
      - "render.yaml"
      - ".github/workflows/deploy-api.yml"

  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      API_URL: ${{ vars.API_URL }}

    steps:
      - name: Check the settings
        run: |
          if [ -z "$RENDER_API_KEY" ]; then echo "::error::The secret RENDER_API_KEY is not set"; exit 1; fi
          if [ -z "$RENDER_SERVICE_ID" ]; then echo "::error::The variable RENDER_SERVICE_ID is not set"; exit 1; fi

      - name: Start the deploy
        id: start
        run: |
          response=$(curl --silent --show-error --fail-with-body \
            --request POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "{\"commitId\": \"${GITHUB_SHA}\"}")
          deploy_id=$(echo "$response" | jq --raw-output '.id // empty')
          if [ -z "$deploy_id" ]; then echo "::error::Render did not start a deploy: $response"; exit 1; fi
          echo "Deploy $deploy_id of commit ${GITHUB_SHA} started"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for the deploy
        env:
          DEPLOY_ID: ${{ steps.start.outputs.deploy_id }}
        run: |
          previous=""
          for _ in $(seq 1 90); do
            status=$(curl --silent --show-error --fail \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Accept: application/json" | jq --raw-output '.status // empty') || status=""
            if [ "$status" != "$previous" ]; then echo "Status: ${status:-unknown}"; previous="$status"; fi
            case "$status" in
              live) exit 0 ;;
              *failed* | canceled | deactivated) echo "::error::The deploy ended with the status $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::The deploy did not finish in 15 minutes"
          exit 1

      - name: Check that the API answers
        if: env.API_URL != ''
        run: curl --silent --show-error --fail --retry 5 --retry-delay 5 --retry-all-errors "${API_URL%/}/health"
